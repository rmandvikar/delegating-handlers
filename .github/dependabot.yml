version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "dev"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "dependabot"
      include: "scope"
    #groups:
    #  minor-and-patch-updates:
    #    patterns:
    #      - "*"
    #    update-types:
    #      - "minor"
    #      - "patch"
    ignore:
      #- dependency-name: "*"
      #  update-types:
      #    - "version-update:semver-major"
      - dependency-name: "Moq"
        versions:
          - "> 4.18.4"
      - dependency-name: "AutoFixture.AutoMoq"
      - dependency-name: "FluentAssertions"
        versions:
          - ">= 8.0.0"
